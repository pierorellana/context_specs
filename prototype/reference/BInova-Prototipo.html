:root{--bg:#E9E7E2;--panel:#FFFFFF;--ink:#141518;--ink2:#5F5E5A;--ink3:#6F6D68;--line:#E4E1DB;--fill:#EFEDE9;--brand:#FF9000}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:'Geist',-apple-system,'SF Pro Text',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
select{font:inherit;color:inherit}
.layout{position:fixed;inset:0;display:flex}
.panel{width:300px;flex:none;margin:16px 0 16px 16px;background:var(--panel);border-radius:22px;box-shadow:0 0 0 1px var(--line);display:flex;flex-direction:column;overflow:hidden;transition:margin 300ms cubic-bezier(.2,.8,.2,1),opacity 200ms ease}
.layout.present .panel{margin-left:-316px;opacity:0;pointer-events:none}
.brand{display:flex;align-items:center;gap:12px;padding:20px 20px 16px;border-bottom:1px solid var(--line)}
.mark{width:40px;height:40px;border-radius:12px;background:#17181B;color:#F6F5F2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:700;font-size:15px;letter-spacing:-.04em;line-height:1}
.mark i{display:block;width:10px;height:2px;border-radius:1px;background:var(--brand)}
.brand b{font-size:17px;letter-spacing:-.03em}.brand b span{font-weight:400;color:var(--ink2)}
.brand small{display:block;font-size:12px;color:var(--ink3);margin-top:2px}
.scroll{flex:1;overflow-y:auto;padding:8px 12px 12px}
.grp{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:14px 8px 6px}
.item{width:100%;text-align:left;display:flex;align-items:center;gap:10px;min-height:38px;padding:8px 10px;border-radius:10px;font-size:14px;line-height:1.3;transition:background-color 160ms ease}
.item:hover{background:var(--fill)}
.item.on{background:#141518;color:#fff}
.item .dot{width:6px;height:6px;border-radius:50%;background:transparent;flex:none}
.item.on .dot{background:var(--brand)}
.sim{border-top:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.sim h3{margin:0;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.sim .none{font-size:13px;color:var(--ink3)}
.tw{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px}
.tw select{height:32px;border:1px solid var(--line);border-radius:8px;background:#FBFAF8;padding:0 8px;max-width:150px}
.tw input{width:18px;height:18px;accent-color:var(--ink)}
.actions{display:flex;gap:8px;padding:0 16px 16px}
.btn{flex:1;height:38px;border-radius:10px;background:var(--fill);font-size:13px;font-weight:600}
.btn.dark{background:#141518;color:#fff}
.stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-width:0;padding-bottom:28px}
.device{position:relative;width:430px;height:884px;transform-origin:center center;flex:none}
.frame{position:absolute;inset:0;border-radius:72px;background:#1B1B1D;box-shadow:inset 0 0 0 2px #3A3A3D,inset 0 0 0 6px #0E0E10,0 40px 80px rgba(20,21,24,.22),0 8px 20px rgba(20,21,24,.12)}
.btns span{position:absolute;background:#2A2A2D;border-radius:2px}
.screen{position:absolute;left:20px;top:20px;width:390px;height:844px;border-radius:54px;overflow:hidden;background:#F6F5F2;isolation:isolate;clip-path:inset(0 round 54px);-webkit-mask-image:-webkit-radial-gradient(white,black)}
.screen iframe{position:absolute;inset:0;width:390px;height:844px;border:0;display:block;background:#F6F5F2}
.status{position:absolute;left:0;right:0;top:0;height:54px;pointer-events:none;display:flex;align-items:center;justify-content:space-between;padding:4px 34px 0 46px;color:#141518;z-index:3}
.status .time{font-size:17px;font-weight:600;letter-spacing:-.01em}
.status .ic{display:flex;gap:6px;align-items:center}
.island{position:absolute;top:11px;left:50%;width:126px;height:37px;margin-left:-63px;border-radius:20px;background:#000;z-index:4;pointer-events:none}

.layout.noframe .frame,.layout.noframe .btns{opacity:0}

.hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:12px;color:var(--ink3);pointer-events:none;transition:opacity 300ms ease}
.layout.present .hint{opacity:0}
.fab{position:absolute;top:16px;left:16px;width:40px;height:40px;border-radius:12px;background:#fff;box-shadow:0 0 0 1px var(--line);display:none;align-items:center;justify-content:center}
.layout.present .fab{display:flex}
/* Teléfono real: la app ocupa toda la pantalla, sin marco ni panel */
.mobile .panel,.mobile .frame,.mobile .btns,.mobile .status,.mobile .island,.mobile .home-ind,.mobile .hint,.mobile .fab{display:none!important}
.mobile .stage{align-items:flex-start;justify-content:flex-start}
.mobile .device{width:390px;height:844px;transform-origin:0 0}
.mobile .screen{left:0;top:0;border-radius:0;clip-path:none;-webkit-mask-image:none}
body.mobile{background:#F6F5F2}

\\"><\\/button>\\n      <div class=\\\"sheet\\\" role=\\\"dialog\\\" aria-label=\\\"Seleccionar moneda\\\" style=\\\"position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 8px 20px 40px\\\">\\n        <div style=\\\"width: 36px; height: 5px; border-radius: 3px; background: #D6D2CA; margin: 0 auto\\\"><\\/div>\\n        <div style=\\\"display: flex; align-items: center; justify-content: space-between; margin-top: 12px\\\">\\n          <h2 style=\\\"margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.02em\\\">{{sheetTitle}}<\\/h2>\\n          <button class=\\\"press\\\" onClick=\\\"{{closeSheet}}\\\" aria-label=\\\"Cerrar\\\" style=\\\"width: 32px; height: 32px; border-radius: 50%; background: #EFEDE9; display: flex; align-items: center; justify-content: center; color: #5F5E5A\\\">\\n            <svg width=\\\"14\\\" height=\\\"14\\\" viewBox=\\\"0 0 24 24\\\" fill=\\\"none\\\" stroke=\\\"currentColor\\\" stroke-width=\\\"2.4\\\" stroke-linecap=\\\"round\\\"><path d=\\\"M6 6l12 12M18 6 6 18\\\"><\\/path><\\/svg>\\n          <\\/button>\\n        <\\/div>\\n        <div style=\\\"margin-top: 12px; border: 1px solid #E4E1DB; border-radius: 16px; overflow: hidden\\\">\\n          <sc-for list=\\\"{{options}}\\\" as=\\\"o\\\" hint-placeholder-count=\\\"6\\\">\\n            <button class=\\\"row\\\" onClick=\\\"{{o.pick}}\\\" aria-pressed=\\\"{{o.selAttr}}\\\" style=\\\"width: 100%; display: flex; align-items: center; gap: 12px; padding: 0 16px; min-height: 56px; border-top: {{o.divider}}; text-align: left\\\">\\n              <span style=\\\"width: 32px; height: 32px; border-radius: 50%; background: #F6F5F2; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600\\\">{{o.sym}}<\\/span>\\n              <span style=\\\"flex: 1; display: flex; flex-direction: column\\\">\\n                <span style=\\\"font-size: 16px; font-weight: 500\\\">{{o.code}}<\\/span>\\n                <span style=\\\"font-size: 13px; color: #6F6D68\\\">{{o.name}}<\\/span>\\n              <\\/span>\\n              <sc-if value=\\\"{{o.sel}}\\\" hint-placeholder-val=\\\"{{ false }}\\\">\\n                <svg width=\\\"20\\\" height=\\\"20\\\" viewBox=\\\"0 0 24 24\\\" fill=\\\"none\\\" stroke=\\\"#FF9000\\\" stroke-width=\\\"2.4\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"><path d=\\\"M5 12.5l4.5 4.5L19 7.5\\\"><\\/path><\\/svg>\\n              <\\/sc-if>\\n            <\\/button>\\n          <\\/sc-for>\\n        <\\/div>\\n      <\\/div>\\n    <\\/div>\\n  <\\/sc-if>\\n<\\/div>\", \"code\": \"\\nconst CUR = {\\n  USD: { code: 'USD', sym: '$', name: 'Dólar estadounidense', rate: 1 },\\n  EUR: { code: 'EUR', sym: '€', name: 'Euro', rate: 0.8603 },\\n  GBP: { code: 'GBP', sym: '£', name: 'Libra esterlina', rate: 0.7462 },\\n  COP: { code: 'COP', sym: '$', name: 'Peso colombiano', rate: 4012.5 },\\n  PEN: { code: 'PEN', sym: 'S/', name: 'Sol peruano', rate: 3.721 },\\n  MXN: { code: 'MXN', sym: '$', name: 'Peso mexicano', rate: 18.452 }\\n};\\nfunction money(sym, n) {\\n  return sym + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });\\n}\\n\\n// Desplazamiento tipo iOS para presentar con mouse: arrastre con inercia y rebote suave en los bordes.\\n// En pantallas táctiles se deja el scroll nativo del sistema (momentum y rebote reales).\\nfunction binovaScroll() {\\n  try {\\n    document.querySelectorAll('.scroll, .hscroll').forEach((el) => {\\n      if (el.dataset.bnScroll) return;\\n      el.dataset.bnScroll = '1';\\n      const hz = el.classList.contains('hscroll');\\n      const P = (e) => (hz ? e.clientX : e.clientY);\\n      const get = () => (hz ? el.scrollLeft : el.scrollTop);\\n      const set = (v) => { if (hz) el.scrollLeft = v; else el.scrollTop = v; };\\n      const max = () => Math.max(0, hz ? el.scrollWidth - el.clientWidth : el.scrollHeight - el.clientHeight);\\n      const tr = (o) => { el. } <span style=\\\"font-weight: 400; color: #6F6D68\\\">/ día<\\/span><\\/span><\\/div>\\n              <div style=\\\"margin-top: 10px; height: 6px; border-radius: 3px; background: #EFEDE9\\\"><div style=\\\"height: 100%; border-radius: 3px; background: #141518; width: {{l.w}}\\\"><\\/div><\\/div>\\n            <\\/div>\\n          <\\/sc-for>\\n        <\\/div>\\n        <button class=\\\"press\\\" onClick=\\\"{{closeLimits}}\\\" style=\\\"margin-top: 20px; width: 100%; height: 54px; border-radius: 16px; background: #141518; color: #FFFFFF; font-size: 17px; font-weight: 600\\\">Listo<\\/button>\\n      <\\/div>\\n    <\\/div>\\n  <\\/sc-if>\\n\\n  <sc-if value=\\\"{{toastOn}}\\\" hint-placeholder-val=\\\"{{ false }}\\\">\\n    <div class=\\\"toast\\\" role=\\\"status\\\" style=\\\"position: absolute; left: 24px; right: 24px; bottom: 112px; z-index: 80; padding: 12px 16px; border-radius: 14px; background: rgba(23,24,27,0.94); color: #F6F5F2; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px\\\"><svg width=\\\"14\\\" height=\\\"14\\\" viewBox=\\\"0 0 24 24\\\" fill=\\\"none\\\" stroke=\\\"currentColor\\\" stroke-width=\\\"2.4\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"><path d=\\\"M5 12.5l4.5 4.5L19 7.5\\\"><\\/path><\\/svg>{{toast}}<\\/div>\\n  <\\/sc-if>\\n<\\/div>\", \"code\": \"\\nconst CARDS = [\\n  { name: 'Débito', title: 'Tarjeta Débito', sub: 'Vinculada a Ahorros', kind: 'Débito', last: '3307',\\n    bg: 'radial-gradient(130% 140% at 22% 12%, #2E2F35 0%, #17181B 50%, #0E0F11 100%)', fg: '#F6F5F2', muted: '#A8A59E', chip: '#D8CDB6',\\n    texture: 'none', texSize: 'auto', swatch: '#17181B', desc: 'Compras y retiros con tu saldo', limits: [['Compras', '$1,500.00', '60%'], ['Retiros en cajero', '$500.00', '40%']] },\\n  { name: 'Crédito', title: 'Tarjeta Crédito', sub: 'Disponible $2,180.00', kind: 'Crédito', last: '9284',\\n    bg: 'linear-gradient(140deg, #F6F3ED 0%, #ECE7DE 60%, #E2DCD1 100%)', fg: '#141518', muted: '#5F5E5A', chip: '#D2C6AE',\\n    texture: 'repeating-radial-gradient(circle at 115% 120%, rgba(20,21,24,.05) 0 1px, transparent 1px 9px)', texSize: 'auto', swatch: '#ECE7DE', desc: 'Cupo de $3,000', limits: [['Compras', '$3,000.00', '100%'], ['Avances de efectivo', '$600.00', '20%']] },\\n  { name: 'Virtual', title: 'Tarjeta Virtual', sub: 'Para compras en línea', kind: 'Virtual', last: '6150',\\n    bg: 'linear-gradient(150deg, #8E8B85 0%, #6F6D68 55%, #5A5853 100%)', fg: '#FFFFFF', muted: 'rgba(255,255,255,.78)', chip: '#C9C6BF',\\n    texture: 'radial-gradient(rgba(255,255,255,.14) 1px, transparent 1.2px)', texSize: '10px 10px', swatch: '#7A7772', desc: 'Para compras en línea, al instante', limits: [['Compras en línea', '$500.00', '35%']] }\\n];\\nconst Y0 = 128, STEP = 46, STAGE_Y = 470;\\nfunction buzz(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }\\nfunction getNav(k, d) { try { const v = sessionStorage.getItem('binova.' + k); return v == null ? d : v; } catch (e) { return d; } }\\nfunction setNav(o) { try { Object.keys(o).forEach((k) => sessionStorage.setItem('binova.' + k, String(o[k]))); } catch (e) {} }\\nclass Component extends DCLogic {\\n  constructor(props) {\\n    super(props);\\n    // Entrada: Productos/Inicio dejan el modo y la tarjeta al frente; sin contexto se usa el Tweak\\n    const tweak = { ver: 'ver', crearVirtual: 'crear', primeraVez: 'first' }[props.modo ?? 'crearVirtual'] || 'crear';\\n    const stored = getNav('cardsMode', '');\\n    let mode = stored === 'ver' ? 'ver' : stored === 'crear' ? 'crear' : tweak;\\n    const hasVirtual = getNav('hasVirtual', '') === '1';\\n    if (mode === 'crear' && hasVirtual) mode = 'ver';\\n    this.mode = mode;\\n    this.from = getNav('cardsFrom', 'productos') === 'home' ? 'home' : 'productos';\\n    const owned = mode === 'first' ? [] : (hasVirtual ? [0, 1, 2] : [0, 1]);\\n    const front = parseInt(getNav('cardsFront', '0'), 10);\\n    const order = owned.indexOf(front) >= 0 ? [front].concat(owned.filter((i) => i !== front)) : owned.slice();\\n    this.queue = mode === 'crear' ? [2] : mode === 'first' ? [0, 2, 1] : [];\\n    this.owned = owned;\\n    this.state = { phase: mode === 'ver' ? 'final' : 'intro', present: owned.slice(), docked: owned.slice(), order: order, flipped: false, tx: 0, ty: 0,\\n      frozen: { 0: mode !== 'first', 1: false, 2: false }, face: 'idle', limits: false, toast: '', created: false };\\n    this.timers = [];\\n  }\\n  componentWillUnmount() { this.clear(); clearTimeout(this.tt); }\\n  clear() { this.timers.forEach(clearTimeout); this.timers = []; }\\n  later(fn, ms) { this.timers.push(setTimeout(fn, ms)); }\\n  flash(m) { clearTimeout(this.tt); this.setState({ toast: m }); this.tt = setTimeout(() => this.setState({ toast: '' }), 2400); }\\n  start() {\\n    this.clear();\\n    if (this.mode === 'first') return this.build();\\n    this.setState({ phase: 'face', face: 'idle' });\\n    this.later(() => this.setState({ face: 'scan' }), 350);\\n    this.later(() => { this.setState({ face: 'ok' }); buzz(10); }, 1600);\\n    this.later(() => this.build(), 2400);\\n  }\\n  build() {\\n    this.clear();\\n    const fail = (this.props.resultado ?? 'exito') === 'error' && !this.retried;\\n    const base = this.owned.slice();\\n    this.setState({ phase: 'build', present: base.slice(), docked: base.slice(), order: base.slice(), flipped: false, failing: false });\\n    let t = 260;\\n    this.queue.forEach((ci, n) => {\\n      this.later(() => { this.setState({ present: this.state.present.concat([ci]) }); buzz(6); }, t);\\n      if (fail && n === this.queue.length - 1) {\\n        this.later(() => { this.setState({ failing: true }); buzz([12, 60, 12]); }, t + 1000);\\n        this.later(() => this.setState({ phase: 'fail', present: base.slice() }), t + 1700);\\n        return;\\n      }\\n      t += 1520;\\n      this.later(() => {\\n        const o = this.state.order.slice();\\n        // La virtual nueva queda al frente; en la creación inicial cada tarjeta se ubica detrás\\n        const order = this.mode === 'crear' ? [ci].concat(o) : o.concat([ci]);\\n        this.setState({ docked: this.state.docked.concat([ci]), order: order });\\n      }, t);\\n      t += 520;\\n    });\\n    if (!fail) this.later(() => { this.setState({ phase: 'final', created: true }); buzz([10, 40, 10]); setNav({ hasVirtual: '1' }); }, t + 260);\\n  }\\n  bringFront(i) { this.setState({ order: [i].concat(this.state.order.filter((x) => x !== i)), flipped: false, tx: 0, ty: 0 }); buzz(6); }\\n  cycle(dir) { const o = this.state.order.slice(); if (dir > 0) o.push(o.shift()); else o.unshift(o.pop()); this.setState({ order: o, flipped: false, tx: 0, ty: 0 }); buzz(6); }\\n  renderVals() {\\n    const s = this.state;\\n    const final = s.phase === 'final';\\n    const dockedOrder = s.order.filter((i) => s.docked.indexOf(i) >= 0);\\n    const k = dockedOrder.length;\\n    const frontIdx = dockedOrder[0];\\n    const lastDocked = s.docked[s.docked.length - 1];\\n    const cards = s.present.map((i) => {\\n      const c = CARDS[i];\\n      const building = s.docked.indexOf(i) < 0;\\n      const d = building ? 0 : dockedOrder.indexOf(i);\\n      const isFront = !building && d === 0;\\n      const y = building ? STAGE_Y : Y0 + (k - 1 - d) * STEP;\\n      const sc = building ? 1 : 1 - d * 0.04;\\n      const tiltOn = final && isFront;\\n      const dg = c.last.split('');\\n      return Object.assign({}, c, {\\n        cls: (building ? 'building' : '') + (!building && i === lastDocked && s.phase === 'build' ? ' arc' : '') + (building && s.failing ? ' failing' : ''),\\n        tf: 'translateY(' + y + 'px) scale(' + sc + ')',\\n        z: building ? 40 : 20 - d,\\n        shade: building ? 0 : Math.min(d * 0.14, 0.4),\\n        frostOp: s.frozen[i] && !building ? 1 : 0,\\n        tilt: tiltOn ? 'rotateX(' + (-s.ty * 7).toFixed(2) + 'deg) rotateY(' + (s.tx * 9).toFixed(2) + 'deg)' : 'none',\\n        flipTf: tiltOn && s.flipped ? 'rotateY(180deg)' : 'none',\\n        sx: tiltOn ? (50 + s.tx * 40) + '%' : '20%', sy: tiltOn ? (30 + s.ty * 40) + '%' : '0%',\\n        glare: tiltOn ? '.16' : '.08',\\n        l1: dg[0], l2: dg[1], l3: dg[2], l4: dg[3],\\n        locked: !final,\\n        aria: isFront ? c.title + ', al frente. ' + (s.flipped ? 'Toca para ver el anverso.' : 'Toca para ver los datos.') : 'Traer ' + c.title + ' al frente',\\n        tap: () => { if (!final) return; if (this.swiped) { this.swiped = false; return; } if (isFront) { this.setState({ flipped: !s.flipped }); buzz(6); } else this.bringFront(i); },\\n        down: (e) => { if (final && isFront) { this.px = e.clientX; this.swiped = false; } },\\n        move: (e) => { if (!tiltOn) return; const r = e.currentTarget.getBoundingClientRect(); this.setState({ tx: Math.max(-1, Math.min(1, ((e.clientX - r.left) / r.width - 0.5) * 2)), ty: Math.max(-1, Math.min(1, ((e.clientY - r.top) / r.height - 0.5) * 2)) }); },\\n        up: (e) => { if (!(final && isFront) || this.px == null) return; const r = e.currentTarget.getBoundingClientRect(); const dx = (e.clientX - this.px) / (r.width / 342 || 1); this.px = null; if (Math.abs(dx) > 50) { this.swiped = true; this.cycle(dx < 0 ? 1 : -1); } },\\n        leave: () => { if (tiltOn) this.setState({ tx: 0, ty: 0 }); }\\n      });\\n    });\\n    const fc = CARDS[frontIdx == null ? 0 : frontIdx];\\n    const frozen = !!s.frozen[frontIdx];\\n    const buildCard = CARDS[s.present.find((i) => s.docked.indexOf(i) < 0) ?? this.queue[this.queue.length - 1] ?? 0];\\n    const total = this.queue.length;\\n    const done = s.docked.filter((i) => this.queue.indexOf(i) >= 0).length;\\n    const first = this.mode === 'first';\\n    const intro = first\\n      ? { title: 'Tus tarjetas, listas en segundos', body: 'Crearemos tres tarjetas vinculadas a tu cuenta de ahorros **** 4821.', cta: 'Crear mis tarjetas', rows: [0, 2, 1].map((i, n) => ({ title: CARDS[i].title, desc: CARDS[i].desc, \\/path><\\/svg>\\n          Compartir comprobante\\n        <\\/button>\\n      <\\/div>\\n    <\\/div>\\n  <\\/sc-if>\\n\\n  <\\!-- Cancelar con datos ingresados: confirmar antes de salir -->\\n  <sc-if value=\\\"{{cancelOpen}}\\\" hint-placeholder-val=\\\"{{ false }}\\\">\\n    <div style=\\\"position: absolute; inset: 0; z-index: 10\\\">\\n      <button class=\\\"dim\\\" aria-label=\\\"Seguir\\\" onClick=\\\"{{keepGoing}}\\\" style=\\\"position: absolute; inset: 0; width: 100%; height: 100%; background: rgba(20,21,24,0.28)\\\"><\\/button>\\n      <div class=\\\"sheet\\\" role=\\\"alertdialog\\\" aria-label=\\\"Cancelar operación\\\" style=\\\"position: absolute; left: 8px; right: 8px; bottom: 34px; display: flex; flex-direction: column; gap: 8px\\\">\\n        <div style=\\\"background: rgba(251,250,248,.96); border-radius: 16px; overflow: hidden; text-align: center\\\">\\n          <div style=\\\"padding: 16px; font-size: 13px; line-height: 1.45; color: #5F5E5A\\\">{{cfg.cancelQ}} Se perderán los datos ingresados.<\\/div>\\n          <a href=\\\"{{origin.href}}\\\" class=\\\"press\\\" style=\\\"display: flex; align-items: center; justify-content: center; min-height: 56px; border-top: 1px solid #E4E1DB; font-size: 17px; font-weight: 500; color: #B3261E\\\">Descartar<\\/a>\\n        <\\/div>\\n        <button class=\\\"press\\\" onClick=\\\"{{keepGoing}}\\\" style=\\\"min-height: 56px; border-radius: 16px; background: #FFFFFF; font-size: 17px; font-weight: 600\\\">Seguir editando<\\/button>\\n      <\\/div>\\n    <\\/div>\\n  <\\/sc-if>\\n<\\/div>\", \"code\": \"\\nconst CFG = {\\n  transfer: { title: 'Transferir', search: 'Nombre, cuenta o cédula', listTitle: 'Contactos', newLabel: 'Nuevo destinatario', verb: 'Vas a transferir',\\n    proc: ['Estamos enviando tu dinero', 'Confirmando con el banco destino'], okTitle: 'Transferencia realizada', okBody: 'Tu transferencia fue enviada correctamente.',\\n    warnTitle: 'Transferencia en proceso', warnBody: 'Estamos es false, moved = false, start = 0, s0 = 0, last = 0, lastT = 0, vel = 0, raf = 0, k = 1, snap = '';\\n      const settle = () => { el.style.transition = 'transform 420ms cubic-bezier(.2,.8,.2,1)'; tr(0); setTimeout(() => { el.style.transition = ''; }, 440); };\\n      const glide = () => {\\n        cancelAnimationFrame(raf);\\n        const step = () => {\\n          vel *= 0.95;\\n          const next = get() + vel * 16;\\n          if (next < 0 || next > max()) { set(Math.min(Math.max(next, 0), max())); vel = 0; }\\n          else set(next);\\n          if (Math.abs(vel) > 0.02) raf = requestAnimationFrame(step);\\n          else if (snap) el.style.scrollSnapType = snap;\\n        };\\n        raf = requestAnimationFrame(step);\\n      };\\n      el.addEventListener('pointerdown', (e) => {\\n        if (e.pointerType !== 'mouse' || e.button !== 0 || e.bnTaken || max() <= 0) return;\\n        e.bnTaken = true;\\n        const r = el.getBoundingClientRect();\\n        k = (hz ? r.width / el.clientWidth : r.height / el.clientHeight) || 1;\\n        cancelAnimationFrame(raf);\\n        down = true; moved = false; start = P(e); s0 = get(); last = start; lastT = performance.now(); vel = 0;\\n        snap = el.style.scrollSnapType || getComputedStyle(el).scrollSnapType;\\n        if (snap && snap !== 'none') el.style.scrollSnapType = 'none'; else snap = '';\\n      });\\n      window.addEventListener('pointermove', (e) => {\\n        if (!down) return;\\n        const p = P(e);\\n        if (!moved && Math.abs(p - start) > 5) { moved = true; el.style.userSelect = 'none'; }\\n        if (!moved) return;\\n        const target = s0 - (p - start) / k;\\n        const m = max();\\n        if (target < 0) { set(0); tr(Math.min(-target * 0.32, 90)); }\\n        else if (target > m) { set(m); tr(-Math.min((target - m) * 0.32, 90)); }\\n        else { set(target); tr(0); }\\n        const now = performance.now();\\n        if (now > lastT) vel = -((p - last) / k) / (now - lastT);\\n        last = p; lastT = now;\\n      });\\n      window.addEventListener('pointerup', () => {\\n        if (!down) return;\\n        down = false;\\n        el.style.userSelect = '';\\n        if (!moved) { if (snap) el.style.scrollSnapType = snap; return; }\\n        if (el.style.transform) { settle(); if (snap) el.style.scrollSnapType = snap; }\\n        else glide();\\n        // Un arrastre no debe disparar el toque del elemento bajo el cursor\\n        el.addEventListener('click', (ev) => { ev.preventDefault(); ev.stopPropagation(); }, { capture: true, once: true });\\n        setTimeout(() => { moved = false; }, 0);\\n      });\\n    });\\n  } catch (e) {}\\n}\\nclass Component extends DCLogic {\\n  componentDidMount() { binovaScroll(); }\\n  componentDidUpdate() { binovaScroll(); }\\n  constructor(props) {\\n    super(props);\\n    const tweak = { transferir: 'transfer', pagar: 'pay', recargar: 'topup' }[props.tipo ?? 'transferir'];\\n    const op = getNav('op', tweak);\\n    this.op = CFG[op] ? op : 'transfer';\\n    this.from = getNav('opFrom', 'home') === 'cuenta' ? 'cuenta' : 'home';\\n    this.state = { step: 'pick', dir: 'fwd', to: 0, amount: '', topup: -1, presses: 0, nudge: 0, bill: 'loading', face: 'idle', faceTries: 0, phase: 'proc', procMsg: 0, retried: false, count: 0, receipt: false, cancel: false };\\n    this.timers = [];\\n  }\\n  componentWillUnmount() { this.clear(); cancelAnimationFrame(this.raf); }\\n  clear() { this.timers.forEach(clearTimeout); this.timers = []; }\\n  later(fn, ms) { this.timers.push(setTimeout(fn, ms)); }\\n  amountNum() {\\n    if (this.op === 'pay') return 32.9;\\n    if (this.op === 'topup') return this.state.topup >= 0 ? TOPUPS[this.state.topup] : 0;\\n    return parseFloat(this.state.amount || '0') || 0;\\n  }\\n  pick(i) {\\n    const keep = i === this.state.to;\\n    this.setState({ to: i, step: 'amount', dir: 'fwd', amount: keep ? this.state.amount : '', topup: keep ? this.state.topup : -1, bill: 'loading' });\\n    if (this.op === 'pay') { this.clear(); this.later(() => this.setState({ bill: 'ready' }), 1000); }\\n  }\\n  press(k) {\\n    let a = this.state.amount;\\n    if (k === 'del') a = a.slice(0, -1);\\n    else if (k === '.') { if (a.indexOf('.') >= 0) return this.setState({ nudge: this.state.nudge + 1 }); a = (a || '0') + '.'; }\\n    else {\\n      const dec = a.indexOf('.') >= 0 ? a.split('.')[1] : null;\\n      if ((dec !== null && dec.length >= 2) || a.replace('.', '').length >= 7) { buzz([8, 40, 8]); return this.setState({ nudge: this.state.nudge + 1 }); }\\n      a = (a === '0' ? '' : a) + k;\\n    }\\n    buzz(6);\\n    this.setState({ amount: a, presses: this.state.presses + 1 });\\n  }\\n  startFace() {\\n    this.clear();\\n    const fail = (this.props.faceId ?? 'exito') === 'falla' && this.state.faceTries === 0;\\n    this.setState({ step: 'face', face: 'idle', faceTries: this.state.faceTries + 1 });\\n    this.later(() => this.setState({ face: 'scan' }), 350);\\n    if (fail) {\\n      this.later(() => { this.setState({ face: 'err' }); buzz([12, 60, 12]); }, 1650);\\n    } else {\\n      this.later(() => { this.setState({ face: 'ok' }); buzz(10); }, 1650);\\n      this.later(() => this.startProcessing(), 2500);\\n    }\\n  }\\n  startProcessing() {\\n    this.clear();\\n    this.setState({ step: 'op', phase: 'proc', procMsg: 0, count: 0 });\\n    this.later(() => this.setState({ procMsg: 1 }), 1400);\\n    const want = this.props.resultado ?? 'exito';\\n    const outcome = this.state.retried ? 'ok' : (want === 'error' ? 'err' : want === 'pendiente' ? 'warn' : 'ok');\\n    this.later(() => {\\n      this.setState({ phase: outcome });\\n      if (outcome === 'ok') { buzz(12); this.countUp(); } else buzz([12, 60, 12]);\\n    }, outcome === 'warn' ? 3600 : 2800);\\n  }\\n  countUp() {\\n    const target = this.amountNum();\\n    let reduce = false;\\n    try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}\\n    if (reduce) return this.setState({ count: target });\\n    const t0 = performance.now() + 480, dur = 650;\\n    const tick = (now) => {\\n      const p = Math.max(0, Math.min(1, (now - t0) / dur));\\n      this.setState({ count: target * (1 - Math.pow(1 - p, 3)) });\\n      if (p < 1) this.raf = requestAnimationFrame(tick);\\n    };\\n    this.raf = requestAnimationFrame(tick);\\n  }\\n  renderVals() {\\n    const s = this.state;\\n    const op = this.op;\\n    const cfg = CFG[op];\\n    const list = TARGETS[op];\\n    const t = list[Math.min(s.to, list.length - 1)];\\n    const to = Object.assign({ ini: '' }, t, { ini: t.ini || (op === 'pay' ? t.name.charAt(0) : '·') });\\n    const n = this.amountNum();\\n    const over = n > AVAILABLE;\\n    const raw = s.amount || '0';\\n    const parts = raw.split('.');\\n    const shown = parseInt(parts[0] || '0', 10).toLocaleString('en-US') + (parts.length > 1 ? '.' + parts[1] : '');\\n    const popCls = s.presses % 2 ? 'pa' : 'pb';\\n    const canGo = op === 'pay' ? s.bill === 'ready' : n > 0 && !over;\\n    const phase = s.phase;\\n    const origin = this.from === 'cuenta' ? { href: 'Cuenta.dc.html', label: 'tu cuenta' } : { href: 'Home.dc.html', label: 'Inicio' };\\n    const rows = op === 'transfer'\\n      ? [['Para', t.name], ['Banco destino', t.bank], ['Cuenta destino', t.acct], ['Desde', 'Ahorros **** 4821'], ['Comisión', '$0.00']]\\n      : op === 'pay'\\n        ? [['Servicio', t.name], ['Referencia', t.sub], ['Período', 'Septiembre 2026'], ['Desde', 'Ahorros **** 4821'], ['Comisión', '$0.00']]\\n        : [['Línea', t.sub], ['Titular', t.name], ['Desde', 'Ahorros **** 4821'], ['Comisión', '$0.00']];\\n    return {\\n      cfg: cfg,\\n      origin: origin,\\n      dirCls: s.dir,\\n      isTransfer: op === 'transfer', isPay: op === 'pay', isTopup: op === 'topup',\\n      sPick: s.step === 'pick',\\n      sAmount: s.step === 'amount',\\n      sConfirmLayer: s.step === 'confirm' || s.step === 'face',\\n      sFace: s. 50%; background: #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,.15); transform: translateX({{sw.hide.x}})\\\"><\\/span><\\/button><\\/div>\\n            <div class=\\\"kv\\\"><span>Reducir movimiento<\\/span><span style=\\\"color: #5F5E5A\\\">Según el sistema<\\/span><\\/div>\\n          <\\/div>\\n        <\\/sc-if>\\n        <button class=\\\"press\\\" onClick=\\\"{{close}}\\\" style=\\\"margin-top: 20px; width: 100%; height: 54px; border-radius: 16px; background: #141518; color: #FFFFFF; font-size: 17px; font-weight: 600\\\">Listo<\\/button>\\n      <\\/div>\\n    <\\/div>\\n  <\\/sc-if>\\n\\n  <sc-if value=\\\"{{logoutOn}}\\\" hint-placeholder-val=\\\"{{ false }}\\\">\\n    <div style=\\\"position: absolute; inset: 0; z-index: 10\\\">\\n      <button class=\\\"dim\\\" aria-label=\\\"Cancelar\\\" onClick=\\\"{{close}}\\\" style=\\\"position: absolute; inset: 0; width: 100%; height: 100%; background: rgba(20,21,24,0.28)\\\"><\\/button>\\n      <div class=\\\"sheet\\\" role=\\\"alertdialog\\\" aria-label=\\\"Cerrar sesión\\\" style=\\\"position: absolute; left: 8px; right: 8px; bottom: 34px; display: flex; flex-direction: column; gap: 8px\\\">\\n        <div style=\\\"background: rgba(251,250,248,.96); border-radius: 16px; overflow: hidden; text-align: center\\\">\\n          <div style=\\\"padding: 16px; font-size: 13px; line-height: 1.45; color: #5F5E5A\\\">¿Cerrar sesión en BInova? Para volver a entrar usarás Face ID o tu contraseña.<\\/div>\\n          <a href=\\\"Login.dc.html\\\" class=\\\"press\\\" style=\\\"display: flex; align-items: center; justify-content: center; min-height: 56px; border-top: 1px solid #E4E1DB; font-size: 17px; font-weight: 500; color: #B3261E\\\">Cerrar sesión<\\/a>\\n        <\\/div>\\n        <button class=\\\"press\\\" onClick=\\\"{{close}}\\\" style=\\\"min-height: 56px; border-radius: 16px; background: #FFFFFF; font-size: 17px; font-weight: 600\\\">Cancelar<\\/button>\\n      <\\/div>\\n    <\\/div>\\n  <\\/sc-if>\\n<\\/div>\", \"code\": \"\\nfunction getNav(k, d) { try { const v = sessionStorage.getItem('binova.' + k); return v == null ? d : v; } catch (e) { return d; } }\\nfunction setNav(o) { try { Object.keys(o).forEach((k) => sessionStorage.setItem('binova.' + k, String(o[k]))); } catch (e) {} }\\nconst TITLES = { notif: 'Notificaciones', datos: 'Datos personales', seg: 'Seguridad', dev: 'Dispositivos', pref: 'Preferencias' };\\n\\n// Desplazamiento tipo iOS para presentar con mouse: arrastre con inercia y rebote suave en los bordes.\\n// En pantallas táctiles se deja el scroll nativo del sistema (momentum y rebote reales).\\nfunction binovaScroll() {\\n  try {\\n    document.querySelectorAll('.scroll, .hscroll').forEach((el) => {\\n      if (el.dataset.bnScroll) return;\\n      el.dataset.bnScroll = '1';\\n      const hz = el.classList.contains('hscroll');\\n      const P = (e) => (hz ? e.clientX : e.clientY);\\n      const get = () => (hz ? el.scrollLeft : el.scrollTop);\\n      const set = (v) => { if (hz) el.scrollLeft = v; else el.scrollTop = v; };\\n      const max = () => Math.max(0, hz ? el.scrollWidth - el.clientWidth : el.scrollHeight - el.clientHeight);\\n      const tr = (o) => { el.style.transform = o ? (hz ? 'translateX(' : 'translateY(') + o + 'px)' : ''; };\\n      let down = false, moved = false, start = 0, s0 = 0, last = 0, lastT = 0, vel = 0, raf = 0, k = 1, snap = '';\\n      const settle = () => { el.style.transition = 'transform 420ms cubic-bezier(.2,.8,.2,1)'; tr(0); setTimeout(() => { el.style.transition = ''; }, 440); };\\n      const glide = () => {\\n        cancelAnimationFrame(raf);\\n        const step = () => {\\n          vel *= 0.95;\\n          const next = get() + vel * 16;\\n          if (next < 0 || next > max()) { set(Math.min(Math.max(next, 0), max())); vel = 0; }\\n          else set(next);\\n          if (Math.abs(vel) > 0.02) raf = requestAnimationFrame(step);\\n          else if (snap) el.style.scrollSnapType = snap;\\n        };\\n        raf = re
