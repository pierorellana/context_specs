border-radius:9px;font-size:13px;font-weight:500;white-space:nowrap}\\n\", \"template\": \"<div class=\\\"app\\\" style=\\\"width: 1600px; min-height: 4000px; background: #FBFAF8; padding: 80px; display: flex; flex-direction: column; gap: 56px\\\">\\n\\n  <header style=\\\"display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 32px; border-bottom: 1px solid #E4E1DB\\\">\\n    <div>\\n      <div style=\\\"font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #6F6D68\\\">Iteración 4 · UX y navegación<\\/div>\\n      <h1 style=\\\"margin: 8px 0 0; font-size: 48px; font-weight: 600; letter-spacing: -0.04em\\\">Mapa de navegación de BInova<\\/h1>\\n      <p style=\\\"margin: 10px 0 0; font-size: 17px; color: #5F5E5A; max-width: 820px\\\">Cada flujo sigue la misma forma: entrada → acción → confirmación → procesamiento → resultado → siguiente acción. Este mapa es la referencia; las pantallas del canvas ya están conectadas así.<\\/p>\\n    <\\/div>\\n    <div style=\\\"display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; max-width: 520px\\\">\\n      <span class=\\\"chip\\\" style=\\\"background: #141518; color: #FFFFFF\\\">Pestaña<\\/span>\\n      <span class=\\\"chip\\\" style=\\\"background: #FFFFFF; box-shadow: inset 0 0 0 1px #D6D2CA\\\">Pantalla<\\/span>\\n      <span class=\\\"chip\\\" style=\\\"background: #EFEDE9\\\">Sheet / modal<\\/span>\\n      <span class=\\\"chip\\\" style=\\\"background: #FFF1DF; color: #8A4A00\\\">Seguridad (Face ID)<\\/span>\\n      <span class=\\\"chip\\\" style=\\\"background: #FFFFFF; box-shadow: inset 0 0 0 1px #D6D2CA; border-left: 0\\\"><span style=\\\"width: 8px; height: 8px; border-radius: 50%; background: #FF9000; margin-right: 8px\\\"><\\/span>Estado del sistema<\\/span>\\n      <span class=\\\"chip\\\" style=\\\"background: transparent; box-shadow: inset 0 0 0 1px #C9C6BF; color: #5F5E5A; border: 0; outline: 1px dashed #C9C6BF; outline-offset: -1px\\\">Ruta alternativa<\\/span>\\n    <\\/div>\\n  <\\/header>\\n\\n  <section>\\n    <h2 style=\\\"margin: 0 0 6px; font-size: 26px; font-weight: 600; letter-spacing: -0.02em\\\">Arquitectura<\\/h2>\\n    <p class=\\\"cap\\\" style=\\\"margin: 0 0 20px; max-width: 900px\\\">Se mantienen cuatro pestañas. Transferir, pagar, recargar, conversor, notificaciones y creación de tarjetas no son pestañas: se abren desde su contexto y ocultan la barra inferior mientras duran.<\\/p>\\n    <div style=\\\"display: grid; grid-template-columns: 1fr repeat(4, minmax(0, 1fr)); gap: 16px\\\">\\n      <sc-for list=\\\"{{arch}}\\\" as=\\\"col\\\" hint-placeholder-count=\\\"5\\\">\\n        <div style=\\\"background: #FFFFFF; border: 1px solid #E4E1DB; border-radius: 18px; padding: 18px\\\">\\n          <span class=\\\"chip\\\" style=\\\"background: {{col.bg}}; color: {{col.fg}}\\\">{{col.name}}<\\/span>\\n          <div style=\\\"margin-top: 14px; display: flex; flex-direction: column; gap: 8px\\\">\\n            <sc-for list=\\\"{{col.items}}\\\" as=\\\"it\\\" hint-placeholder-count=\\\"5\\\">\\n              <div style=\\\"display: flex; gap: 8px; font-size: 14px; line-height: 1.4; padding-left: {{it.indent}}\\\">\\n                <span style=\\\"color: #A8A59E\\\">{{it.mark}}<\\/span>\\n                <span><span style=\\\"font-weight: 500\\\">{{it.t}}<\\/span><span style=\\\"color: #6F6D68\\\">{{it.s}}<\\/span><\\/span>\\n              <\\/div>\\n            <\\/sc-for>\\n          <\\/div>\\n        <\\/div>\\n      <\\/sc-for>\\n    <\\/div>\\n  <\\/section>\\n\\n  <section>\\n    <h2 style=\\\"margin: 0 0 20px; font-size: 26px; font-weight: 600; letter-spacing: -0.02em\\\">Flujos principales<\\/h2>\\n    <div style=\\\"display: flex; flex-direction: column; gap: 14px\\\">\\n      <sc-for list=\\\"{{flows}}\\\" as=\\\"f\\\" hint-placeholder-count=\\\"9\\\">\\n        <div style=\\\"background: #FFFFFF; border: 1px solid #E4E1DB; border-radius: 18px; padding: 18px 20px; display: grid; grid-template-columns: 170px 1fr; gap: 20px\\\">\\n          <div>\\n            <div style=\\\"font-size: 16px; font-weight: 600\\\">{{f.name}}<\\/div>\\n            <div class=\\\"cap\\\" style=\\\"margin-top: 2px\\\">{{f.where}}<\\/div>\\n          <\\/div>\\n          <div style=\\\"display: flex; flex-direction: column; gap: 10px\\\">\\n            <div style=\\\"display: flex; flex-wrap: wrap; align-items: center; gap: 6px\\\">\\n              <sc-for list=\\\"{{f.steps}}\\\" as=\\\"s\\\" hint-placeholder-count=\\\"7\\\">\\n                <span style=\\\"display: inline-flex; align-items: center; gap: 6px\\\">\\n                  <span class=\\\"chip\\\" style=\\\"background: {{s.bg}}; color: {{s.fg}}; box-shadow: {{s.ring}}\\\"><sc-if value=\\\"{{s.sys}}\\\" hint-placeholder-val=\\\"{{ false }}\\\"><span style=\\\"width: 7px; height: 7px; border-radius: 50%; background: #FF9000; margin-right: 7px\\\"><\\/span><\\/sc-if>{{s.t}}<\\/span>\\n                  <sc-if value=\\\"{{s.arrow}}\\\" hint-placeholder-val=\\\"{{ true }}\\\"><svg width=\\\"16\\\" height=\\\"16\\\" viewBox=\\\"0 0 24 24\\\" fill=\\\"none\\\" stroke=\\\"#A8A59E\\\" stroke-width=\\\"2\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"><path d=\\\"M5 12h14M13 6l6 6-6 6\\\"><\\/path><\\/svg><\\/sc-if>\\n                <\\/span>\\n              <\\/sc-for>\\n            <\\/div>\\n            <sc-for list=\\\"{{f.alts}}\\\" as=\\\"a\\\" hint-placeholder-count=\\\"2\\\">\\n              <div style=\\\"display: flex; align-items: center; gap: 8px; font-size: 13px; color: #3A3936\\\">\\n                <svg width=\\\"14\\\" height=\\\"14\\\" viewBox=\\\"0 0 24 24\\\" fill=\\\"none\\\" stroke=\\\"#A8A59E\\\" stroke-width=\\\"2\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"><path d=\\\"M6 4v8a4 4 0 0 0 4 4h9M15 12l4 4-4 4\\\"><\\/path><\\/svg>\\n                <span style=\\\"font-weight: 600\\\">{{a.if}}<\\/span><span style=\\\"color: #5F5E5A\\\">{{a.then}}<\\/span>\\n              <\\/div>\\n            <\\/sc-for>\\n          <\\/div>\\n        <\\/div>\\n      <\\/sc-for>\\n    <\\/div>\\n  <\\/section>\\n\\n  <section>\\n    <h2 style=\\\"margin: 0 0 20px; font-size: 26px; font-weight: 600; letter-spacing: -0.02em\\\">Reglas de navegación<\\/h2>\\n    <div style=\\\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px\\\">\\n      <sc-for list=\\\"{{rules}}\\\" as=\\\"r\\\" hint-placeholder-count=\\\"8\\\">\\n        <div style=\\\"background: #FFFFFF; border: 1px solid #E4E1DB; border-radius: 18px; padding: 18px\\\">\\n          <div style=\\\"font-size: 15px; font-weight: 600\\\">{{r.t}}<\\/div>\\n          <p class=\\\"cap\\\" style=\\\"margin: 6px 0 0\\\">{{r.d}}<\\/p>\\n        <\\/div>\\n      <\\/sc-for>\\n    <\\/div>\\n  <\\/section>\\n\\n  <section>\\n    <h2 style=\\\"margin: 0 0 20px; font-size: 26px; font-weight: 600; letter-spacing: -0.02em\\\">Auditoría: qué se encontró y qué se corrigió<\\/h2>\\n    <div style=\\\"background: #FFFFFF; border: 1px solid #E4E1DB; border-radius: 18px; overflow: hidden\\\">\\n      <div style=\\\"display: grid; grid-template-columns: 56px 220px 1fr 1fr; gap: 16px; padding: 12px 20px; background: #F6F5F2; font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: #6F6D68\\\"><span>#<\\/span><span>Pantalla<\\/span><span>Hallazgo<\\/span><span>Corrección<\\/span><\\/div>\\n      <sc-for list=\\\"{{audit}}\\\" as=\\\"a\\\" hint-placeholder-count=\\\"20\\\">\\n        <div style=\\\"display: grid; grid-template-columns: 56px 220px 1fr 1fr; gap: 16px; padding: 12px 20px; border-top: 1px solid #EFEDE9; font-size: 14px; line-height: 1.45\\\">\\n          <span style=\\\"color: #6F6D68\\\">{{a.n}}<\\/span><span style=\\\"font-weight: 500\\\">{{a.p}}<\\/span><span style=\\\"color: #3A3936\\\">{{a.f}}<\\/span><span>{{a.c}}<\\/span>\\n        <\\/div>\\n      <\\/sc-for>\\n    <\\/div>\\n  <\\/section>\\n<\\/div>\", \"code\": \"\\nconst T = (t) => ({ t: t, kind: 'tab' });\\nconst P = (t) => ({ t: t, kind: 'pantalla' });\\nconst S = (t) => ({ t: t, kind: 'sheet' });\\nconst F = (t) => ({ t: t, kind: 'seg' });\\nconst X = (t) => ({ t: t, kind: 'sys' });\\nconst STYLE = {\\n  tab: { bg: '#141518', fg: '#FFFFFF', ring: 'none' },\\n  pantalla: { bg: '#FFFFFF', fg: '#141518', ring: 'inset 0 0 0 1px #D6D2CA' },\\n  sheet: { bg: '#EFEDE9', fg: '#141518', ring: 'none' },\\n  seg: { bg: '#FFF1DF', fg: '#8A4A00', ring: 'none' },\\n  sys: { bg: '#FFFFFF', fg: '#141518', ring: 'inset 0 0 0 1px #D6D2CA' }\\n};\\nconst FLOWS = [\\n  { name: 'Acceso', where: 'Splash', steps: [P('Splash'), P('Onboarding (1.ª vez)'), P('Login'), X('Verificando'), X('Cargando inicio'), T('Inicio')],\\n    alts: [['Con sesión guardada:', 'Splash → Face ID → Inicio'], ['Credenciales inválidas:', 'error inline con intentos restantes → Recuperar contraseña (sheet)'], ['Face ID falla:', 'Intentar nuevamente → Usar contraseña']] },\\n  { name: 'Transferir', where: 'Inicio · Cuenta', steps: [P('Destinatario'), P('Monto'), P('Confirmación'), F('Face ID'), X('Procesando'), X('Resultado'), S('Comprobante')],\\n    alts: [['Éxito:', 'Listo (vuelve al origen) · Otra transferencia · Comprobante'], ['Error:', 'Reintentar · Cambiar monto · Volver a confirmación. Siempre se informa que el dinero no fue debitado'], ['Pendiente:', 'Entendido · Ver en movimientos'], ['Cancelar en confirmación:', 'se pide confirmar antes de descartar los datos']] },\\n  { name: 'Pagar servicios', where: 'Inicio', steps: [P('Servicio'), X('Consultando planilla'), P('Valor a pagar'), P('Confirmación'), F('Face ID'), X('Procesando'), X('Resultado')],\\n    alts: [['Mismo cierre que Transferir:', 'comprobante, otro pago o volver a Inicio']] },\\n  { name: 'Recargar', where: 'Inicio', steps: [P('Número'), P('Monto'), P('Confirmación'), F('Face ID'), X('Procesando'), X('Resultado')],\\n    alts: [['Mismo cierre que Transferir:', 'comprobante, otra recarga o volver a Inicio']] },\\n  { name: 'Cuentas', where: 'Inicio · Productos', steps: [P('Cuenta (expansión)'), P('Movimientos'), S('Detalle del movimiento')],\\n    alts: [['Sin movimientos:', 'estado vacío con acción «Compartir datos de cuenta»'], ['Sin conexión:', 'último saldo conocido y operaciones deshabilitadas → Reintentar']] },\\n  { name: 'Tarjetas', where: 'Productos · Inicio', steps: [P('Tus tarjetas (pila)'), P('Ver datos (giro)'), S('Congelar / Límites')],\\n    alts: [['Crear tarjeta virtual:', 'Productos → Intro → Face ID → Creando (construcción) → entra a la pila → Tarjeta creada'], ['Sin tarjetas:', 'creación inicial de Débito, Virtual y Crédito']] },\\n  { name: 'Conversor', where: 'Inicio (Más · Para ti)', steps: [P('Conversor'), S('Elegir moneda'), X('Actualizando'), P('Resultado')],\\n    alts: [['Servicio externo caído:', 'error inline + Reintentar; el resto de BInova sigue funcionando']] },\\n  { name: 'Notificaciones', where: 'Campana en Inicio', steps: [P('Notificaciones'), P('Destino según categoría')],\\n    alts: [['Finanzas →', 'Movimientos con el detalle abierto'], ['Seguridad →', '«Sí, fui yo» la resuelve · «No reconozco» → Perfil · Seguridad'], ['Información →', 'Insights']] },\\n  { name: 'Perfil', where: 'Pestaña Perfil', steps: [T('Perfil'), S('Datos · Seguridad · Dispositivos · Preferencias'), S('Cerrar sesión: confirmar'), P('Login')],\\n    alts: [['Face ID se activa o desactiva', 'en el mismo listado, sin salir de Perfil']] }\\n];\\nconst ARCH = [\\n  { name: 'Acceso', bg: '#FFFFFF', fg: '#141518', items: [['Splash', ''], ['Onboarding', ' · solo 1.ª vez', 1], ['Login', '', 1], ['Face ID', ' · con sesión', 1], ['Cargando inicio', '', 2]] },\\n  { name: 'Inicio', bg: '#141518', fg: '#FFFFFF', items: [['Notificaciones', ' · campana'], ['Cuenta de ahorros', ''], ['Movimientos → detalle', '', 1], ['Transferir · Pagar · Recargar', ''], ['Más (sheet) → Conversor', ''], ['Para ti → Insights · Conversor', ''], ['Tarjeta de crédito → Tus tarjetas', '']] },\\n  { name: 'Productos', bg: '#141518', fg: '#FFFFFF', items: [['Cuenta de ahorros', ''], ['Movimientos → detalle', '', 1], ['Transferir', '', 1], ['Cuenta corriente', ''], ['Movimientos (vacío)', '', 1], ['Tus tarjetas', ''], ['Crear tarjeta virtual', '', 1]] },\\n  { name: 'Insights', bg: '#141518', fg: '#FFFFFF', items: [['Gastos del mes', ''], ['Categoría → Movimientos', ''], ['Para ti', ' · recomendaciones']] },\\n  { name: 'Perfil', bg: '#141518', fg: '#FFFFFF', items: [['Datos personales', ' · sheet'], ['Seguridad', ' · sheet'], ['Face ID', ' · switch'], ['Dispositivos', ' · sheet'], ['Notificaciones', ''], ['Preferencias', ' · sheet'], ['Cerrar sesión', ' · confirmación']] }\\n];\\nconst RULES = [\\n  ['Volver (‹)', 'Regresa al paso anterior sin perder lo ingresado. La etiqueta nombra la pantalla de origen real.'],\\n  ['Cancelar', 'Solo al inicio de una operación. Si ya hay datos, se pide confirmar antes de descartarlos.'],\\n  ['Punto de no retorno', 'Después de Face ID la operación no se modifica: Procesando no tiene botón atrás ni barra inferior.'],\\n  ['Cerrar un sheet', 'Siempre igual: botón × arriba a la derecha, tocar fuera o deslizar hacia abajo.'],\\n  ['Botón principal', 'Abajo, ancho completo, a 40 pt del borde. Secundario debajo, sin fondo.'],\\n  ['Barra inferior', 'Visible en pestañas y sus detalles; oculta en Operaciones, Face ID y creación de tarjetas.'],\\n  ['Resultado', 'Toda operación termina en Éxito, Pendiente o Error, y cada uno ofrece una siguiente acción.'],\\n  ['Estados de carga', 'Viven dentro de la pantalla que los causa: skeleton, inline o indicador central, nunca como pantalla suelta.']\\n];\\nconst AUDIT = [\\n  ['Splash', 'Onboarding no tenía entrada: el Splash solo iba a Login o a Face ID.', 'El Splash decide entre primera vez (Onboarding), sin sesión (Login) y con sesión (Face ID).'],\\n  ['Login', '«¿Olvidaste tu contraseña?» y «Abrir una cuenta» no llevaban a ningún lado.', 'Recuperar contraseña es un sheet con su propio envío y confirmación. Se quitó el enlace sin destino.'],\\n  ['Login / Estado · Error', 'El error de acceso era una pantalla aparte, desconectada del login.', 'Ahora el error ocurre dentro del Login, con intentos restantes. Se eliminó la pantalla suelta.'],\\n  ['Login → Inicio', 'Se saltaba directo a Inicio, sin estado de carga.', 'Login → Verificando → Cargando inicio (skeleton) → Inicio.'],\\n  ['Inicio', 'Pagar y Recargar no tenían flujo.', 'Comparten el flujo de operaciones con Transferir: misma confirmación, Face ID, procesamiento y resultado.'],\\n  ['Inicio · Más', 'Cuatro servicios parecían disponibles pero no llevaban a nada.', 'Se marcan como «Próximamente» y no son tocables.'],\\n  ['Inicio · Movimientos', 'Tocar un movimiento abría la lista sin contexto.', 'Abre Movimientos con el detalle de ese movimiento ya desplegado.'],\\n  ['Inicio · Tarjeta de crédito', 'Llevaba a Productos, una pestaña sin relación directa.', 'Abre Tus tarjetas con la de crédito al frente.'],\\n  ['Cuenta', 'El regreso siempre decía «Productos», incluso viniendo de Inicio. «Transferir» no llevaba a nada.', 'El regreso y la pestaña activa dependen del origen. Transferir inicia el flujo y vuelve a la cuenta.'],\\n  ['Cuenta corriente', 'No tenía detalle.', 'Usa la misma pantalla de detalle con sus datos. «Ver movimientos» muestra el estado vacío.'],\\n  ['Movimientos', '«Atrás» siempre iba a Inicio. Descargar, Reportar y Compartir no hacían nada.', 'El regreso respeta el origen. Las acciones confirman con un aviso breve.'],\\n  ['Transferir', 'No había forma segura de cancelar ni de corregir el monto tras un error. Éxito no ofrecía otra transferencia.', 'Cancelar pide confirmación. Error ofrece Reintentar, Cambiar monto o Volver. Éxito ofrece Listo, Otra transferencia y Comprobante.'],\\n  ['Transferir · Face ID', 'Solo existía el caso feliz.', 'Si falla: reintentar o volver a la confirmación.'],\\n  ['Productos', 'Las tarjetas y la cuenta corriente no llevaban a nada. El «+» no indicaba qué agregaba.', 'Cada producto abre su detalle. La creación de tarjeta virtual tiene su propia fila. Se quitó el «+».'],\\n  ['Tarjetas', 'Creaba tarjetas que el usuario ya tenía. «Congelar» y «Límites» no hacían nada.', 'Por defecto se ven las tarjetas existentes y se crea solo la virtual (con Face ID). Congelar funciona y la débito llega bloqueada, igual que en Productos.'],\\n  ['Conversor / Servicio no disponible', 'La caída del servicio era una pantalla aparte.', 'La caída ocurre dentro del Conversor al actualizar, con Reintentar. Se eliminó la pantalla suelta.'],\\n  ['Notificaciones', 'Las notificaciones no eran accionables.', 'Cada una lleva a su contexto. Las de seguridad se resuelven en la misma pantalla.'],\\n  ['Insights', '«Crear un presupuesto» no tenía destino.', 'Lleva a los movimientos que explican el aumento.'],\\n  ['Perfil', 'Las filas no abrían nada y «Cerrar sesión» salía sin preguntar.', 'Cada ajuste abre un sheet. Cerrar sesión pide confirmación.'],\\n  ['Sin conexión', 'Era una variante sin salida.', '«Reintentar» → Cargando inicio → Inicio.']\\n];\\nclass Component extends DCLogic {\\n  renderVals() {\\n    return {\\n      arch: ARCH.map((c) => ({ name: c.name, bg: c.bg, fg: c.fg, items: c.items.map(([t, s, lv]) => ({ t: t, s: s, indent: ((lv || 0) * 16) + 'px', mark: lv ? '└' : '•' })) })),\\n      flows: FLOWS.map((f) => ({ name: f.name, where: f.where, alts: f.alts.map(([a, b]) => ({ if: a, then: b })),\\n        steps: f.steps.map((s, i) => Object.assign({ t: s.t, sys: s.kind === 'sys', arrow: i < f.steps.length - 1 }, STYLE[s.kind])) })),\\n      rules: RULES.map(([t, d]) => ({ t: t, d: d })),\\n      audit: AUDIT.map(([p, f, c], i) => ({ n: String(i + 1).padStart(2, '0'), p: p, f: f, c: c }))\\n    };\\n  }\\n}\\n\", \"props\": {\"$preview\": {\"width\": 1600, \"height\": 4000}}, \"title\": \"BInova — Mapa de navegación\"}};window.BN_START=\"Flujos\";<\/script><script>/* BInova · runtime del prototipo\n   Interpreta las pantallas .dc.html (plantilla + lógica) con Preact, sin dependencias externas.\n   - {{ruta}}: búsqueda con puntos sobre renderVals() y variables de bucle\n   - <sc-if value>, <sc-for list as>: condicionales y repeticiones\n   - onClick/onPointer…/onInput/onSubmit/ref: eventos y referencias\n   - <a href=\"X.dc.html\">: navegación entre pantallas dentro del mismo dispositivo */\n(function () {\n  'use strict';\n  var P = window.preact, h = P.h, render = P.render;\n\n  // ---------- Almacenamiento de sesión compartido entre pantallas (en memoria) ----------\n  var mem = {};\n  var store = {\n    getItem: function (k) { return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null; },\n    setItem: function (k, v) { mem[k] = String(v); },\n    removeItem: function (k) { delete mem[k]; },\n    clear: function () { mem = {}; }\n  };\n\n  // Base de la lógica de cada pantalla (equivalente a DCLogic del editor)\n  var DCLogic = class extends P.Component {};\n\n  // ---------- Plantillas ----------\n  var HOLE = /\\{\\{\\s*([^}]+?)\\s*\\}\\}/g;\n  var WHOLE = /^\\s*\\{\\{\\s*([^}]+?)\\s*\\}\\}\\s*$/;\n\n  function lookup(path, scope) {\n    path = path.trim();\n    if (path === 'true') return true;\n    if (path === 'false') return false;\n    if (path === 'null') return null;\n    if (/^-?\\d+(\\.\\d+)?$/.test(path)) return Number(path);\n    if (/^'.*'$|^\".*\"$/.test(path)) return path.slice(1, -1);\n    var parts = path.split('.');\n    var v = scope[parts[0]];\n    for (var i = 1; i < parts.length; i++) { if (v == null) return undefined; v = v[parts[i]]; }\n    return v;\n  }\n  function interp(str, scope) {\n    return str.replace(HOLE, function (_, p) { var v = lookup(p, scope); return v == null ? '' : String(v); });\n  }\n  function jsxText(t) {\n    if (t.indexOf('\\n') < 0) return t;\n    var lines = t.split('\\n'), out = [];\n    for (var i = 0; i < lines.length; i++) {\n      var l = lines[i];\n      if (i > 0) l = l.replace(/^\\s+/, '');\n      if (i < lines.length - 1) l = l.replace(/\\s+$/, '');\n      if (l) out.push(l);\n    }\n    return out.join(' ');\n  }\n\n  var RENAME = { defaultvalue: 'defaultValue', inputmode: 'inputMode', readonly: 'readOnly', tabindex: 'tabIndex', autocomplete: 'autocomplete' };\n\n  function compile(node) {\n    // Convierte el DOM de la plantilla en un árbol ligero reutilizable\n    if (node.nodeType === 3) {\n      var t = jsxText(node.nodeValue);\n      return t ? { t: t } : null;\n    }\n    if (node.nodeType !== 1) return null;\n    var tag = node.localName;\n    var attrs = [];\n    for (var i = 0; i < node.attributes.length; i++) {\n      var a = node.attributes[i];\n      if (a.name.indexOf('hint-') === 0) continue;\n      attrs.push([a.name, a.value]);\n    }\n    var kids = [];\n    var src = tag === 'template' ? node.content.childNodes : node.childNodes;\n    for (var j = 0; j < src.length; j++) { var c = compile(src[j]); if (c) kids.push(c); }\n    return { tag: tag, attrs: attrs, kids: kids, svg: node.namespaceURI === 'http://www.w3.org/2000/svg' };\n  }\n\n  function build(n, scope, key) {\n    if (n.t != null) return n.t.indexOf('{{') >= 0 ? interp(n.t, scope) : n.t;\n    if (n.tag === 'sc-if') {\n      var cond = attr(n, 'value', scope);\n      return cond ? kids(n, scope) : null;\n    }\n    if (n.tag === 'sc-for') {\n      var list = attr(n, 'list', scope) || [];\n      var as = rawAttr(n, 'as') || 'item';\n      var out = [];\n      for (var i = 0; i < list.length; i++) {\n        var s = Object.create(scope); s[as] = list[i]; s.$index = i;\n        out.push(h(P.Fragment, { key: i }, kids(n, s)));\n      }\n      return out;\n    }\n    var props = {};\n    var isField = n.tag === 'input' || n.tag === 'textarea' || n.tag === 'select';\n    for (var k = 0; k < n.attrs.length; k++) {\n      var name = n.attrs[k][0], val = n.attrs[k][1], v;\n      var m = WHOLE.exec(val);\n      if (m) v = lookup(m[1], scope);\n      else v = val.indexOf('{{') >= 0 ? interp(val, scope) : val;\n      if (name.slice(0, 2) === 'on') {\n        if (typeof v !== 'function') continue;\n        if (name === 'onchange' && isField) name = 'oninput';\n      } else if (name === 'ref') {\n        if (typeof v !== 'function') continue;\n      } else if (RENAME[name]) name = RENAME[name];\n      if (v === undefined) continue;\n      props[name] = v;\n    }\n    if (key != null) props.key = key;\n    return h(n.tag, props, kids(n, scope));\n  }\n  function kids(n, scope) {\n    var out = [];\n    for (var i = 0; i < n.kids.length; i++) out.push(build(n.kids[i], scope));\n    return out;\n  }\n  function rawAttr(n, name) { for (var i = 0; i < n.attrs.length; i++) if (n.attrs[i][0] === name) return n.attrs[i][1]; return null; }\n  function attr(n, name, scope) {\n    var r = rawAttr(n, name); if (r == null) return undefined;\n    var m = WHOLE.exec(r); return m ? lookup(m[1], scope) : interp(r, scope);\n  }\n\n  // ---------- Pantallas ----------\n  var SCREENS = window.BN_SCREENS || {};\n  var compiled = {};\n  function getScreen(name) {\n    if (compiled[name]) return compiled[name];\n    var def = SCREENS[name]; if (!def) return null;\n    var tpl = document.createElement('template');\n    tpl.innerHTML = def.template;\n    var tree = []; tpl.content.childNodes.forEach(function (c) { var x = compile(c); if (x) tree.push(x); });\n    var Comp;\n    try {\n      Comp = new Function('DCLogic', 'sessionStorage', def.code + '\\n;return Component;')(DCLogic, store);\n    } catch (e) { console.error('Pantalla ' + name, e); return null; }\n    Comp.prototype.render = function () {\n      var vals = this.renderVals ? this.renderVals() : {};\n      var scope = Object.create(vals);\n      var out = [];\n      for (var i = 0; i < tree.length; i++) out.push(build(tree[i], scope));\n      return h(P.Fragment, null, out);\n    };\n    compiled[name] = { Comp: Comp, def: def };\n    return compiled[name];\n  }\n\n  // ---------- Navegación ----------\n  var root = document -sizing:border-box}\\n/* Sin barras del navegador: el desplazamiento sigue funcionando con gesto, rueda o trackpad */\\nhtml,body{overflow-x:hidden;overscroll-behavior:none;scrollbar-width:none;-ms-overflow-style:none}\\n*{scrollbar-width:none;-ms-overflow-style:none;-webkit-tap-highlight-color:transparent}\\n*::-webkit-scrollbar{display:none;width:0;height:0;background:transparent}\\n:focus:not(:focus-visible){outline:none}\\nbutton{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}\\n.app{font-family:'Geist',-apple-system,'SF Pro Text',system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#141518}\\n.num{font-variant-numeric:tabular-nums}\\n.press{transition:transform 160ms cubic-bezier(.2,.8,.2,1),opacity 160ms ease}\\n.press:active{transform:scale(0.97);opacity:0.86}\\n.card{background:#FFFFFF;border:1px solid #E4E1DB;border-radius:20px}\\n.h3{margin:0;font-size:16px;font-weight:600}\\n.cap{font-size:13px;line-height:1.5;color:#5F5E5A}\\n\\n/* Curvas */\\n.lane{position:relative;height:6px;border-radius:3px;background:#EFEDE9}\\n.dot{position:absolute;top:-5px;left:0;width:16px;height:16px;border-radius:50%;background:#141518;animation-duration:1.6s;animation-iteration-count:infinite;animation-direction:alternate;animation-name:slide}\\n@keyframes slide{from{left:0}to{left:calc(100% - 16px)}}\\n.c1{animation-timing-function:cubic-bezier(.2,.8,.2,1)}\\n.c2{animation-timing-function:cubic-bezier(.65,0,.35,1)}\\n.c3{animation-timing-function:cubic-bezier(.4,0,1,1)}\\n.c4{animation-timing-function:cubic-bezier(.32,.72,0,1);background:#FF9000}\\n\\n/* Indicador de operación */\\n.op{position:relative;width:120px;height:120px;perspective:700px}\\n.op .shadow{position:absolute;left:24px;right:24px;bottom:-16px;height:14px;border-radius:50%;background:radial-gradient(closest-side,rgba(20,21,24,.22),rgba(20,21,24,0));animation:shadow 2.4s ease-in-out infinite;transition:opacity 300ms ease}\\n@keyframes shadow{0%,100%{transform:scaleX(1);opacity:1}50%{transform:scaleX(.8);opacity:.65}}\\n.op .tile{position:absolute;inset:12px;border-radius:28px;background:radial-gradient(120% 120% at 28% 18%,#2C2D33 0%,#17181B 52%,#0E0F11 100%);\\n  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 14px 30px rgba(20,21,24,.18);transform-style:preserve-3d;display:flex;align-items:center;justify-content:center;\\n  transition:border-radius 460ms cubic-bezier(.65,0,.35,1),background 460ms ease,box-shadow 460ms ease}\\n.op.proc .tile{animation:tilt 2.4s ease-in-out infinite}\\n@keyframes tilt{0%,100%{transform:translateY(0) rotateX(8deg) rotateY(-16deg)}50%{transform:translateY(-6px) rotateX(-4deg) rotateY(16deg)}}\\n.op .trace{position:absolute;left:-5px;top:-5px;width:calc(100% + 10px);height:calc(100% + 10px);overflow:visible;transition:opacity 220ms ease}\\n.op .trace rect{fill:none;stroke:#FF9000;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:16 84;animation:trace 1.6s linear infinite}\\n@keyframes trace{to{stroke-dashoffset:-100}}\\n.op .bi{font-size:28px;font-weight:700;letter-spacing:-.04em;color:#F6F5F2;display:flex;flex-direction:column;align-items:center;gap:6px;line-height:1;transition:opacity 200ms ease,transform 300ms cubic-bezier(.2,.8,.2,1)}\\n.op .g{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 240ms ease 220ms}\\n.op .ring{position:absolute;inset:0;opacity:0;transition:opacity 300ms ease 200ms}\\n.op:not(.proc) .shadow{animation:none;opacity:.6}\\n.op:not(.proc) .trace{opacity:0}\\n.op:not(.proc) .bi{opacity:0;transform:scale(.6)}\\n.op.ok .tile{border-radius:50%;animation:pop 560ms cubic-bezier(.2,.8,.2,1) 120ms both}\\n@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.06)}100%{transform:scale(1)}}\\n.op.warn .tile{border-radius:50%;background:#FFFFFF;box-shadow:inset 0 0 0 1px #E4E1DB,0 8px 22px rgba(20,21,24,.06)}\\n.op.err .tile{background:#F9E9E7;box-shadow:inset 0 0 0 1px #EBC9C5,0 8px 22px rgba(20,21,24,.05);animati  style=\\\"margin: 8px 0 0; font-size: 48px; font-weight: 600; letter-spacing: -0.04em\\\">Cada movimiento explica algo.<\\/h1>\\n    <div style=\\\"margin-top: 28px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 24px\\\">\\n      <div><div style=\\\"font-size: 16px; font-weight: 600\\\">Precisión<\\/div><p class=\\\"cap\\\" style=\\\"margin: 4px 0 0\\\">Arranca rápido y frena suave. Sin rebotes largos.<\\/p><\\/div>\\n      <div><div style=\\\"font-size: 16px; font-weight: 600\\\">Confianza<\\/div><p class=\\\"cap\\\" style=\\\"margin: 4px 0 0\\\">El dinero nunca «aparece»: se cuenta, se confirma, se muestra.<\\/p><\\/div>\\n      <div><div style=\\\"font-size: 16px; font-weight: 600\\\">Seguridad<\\/div><p class=\\\"cap\\\" style=\\\"margin: 4px 0 0\\\">Durante una operación todo lo demás se aquieta.<\\/p><\\/div>\\n      <div><div style=\\\"font-size: 16px; font-weight: 600\\\">Fluidez<\\/div><p class=\\\"cap\\\" style=\\\"margin: 4px 0 0\\\">Los elementos persisten y mutan entre pantallas.<\\/p><\\/div>\\n      <div><div style=\\\"font-size: 16px; font-weight: 600\\\">Tecnología<\\/div><p class=\\\"cap\\\" style=\\\"margin: 4px 0 0\\\">3D solo en el indicador: profundidad moderada, luz suave.<\\/p><\\/div>\\n    <\\/div>\\n  <\\/header>\\n\\n  <section style=\\\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px\\\">\\n    <div class=\\\"card\\\" style=\\\"padding: 24px\\\">\\n      <h2 class=\\\"h3\\\">Duraciones<\\/h2>\\n      <div style=\\\"margin-top: 16px; display: flex; flex-direction: column; gap: 14px\\\">\\n        <div style=\\\"display: grid; grid-template-columns: 180px 1fr 90px; align-items: center; gap: 12px\\\"><span style=\\\"font-size: 14px\\\">Microinteracción<\\/span><span style=\\\"height: 8px; border-radius: 4px; background: #141518; width: 7%\\\"><\\/span><span class=\\\"num cap\\\">120–220 ms<\\/span><\\/div>\\n        <div style=\\\"display: grid; grid-template-columns: 180px 1fr 90px; align-items: center; gap: 12px\\\"><span style=\\\"font-size: 14px\\\">Navegación<\\/span><span style=\\\"height: 8px; border-radius: 4px; background: #141518; width: 12%\\\"><\\/span><span class=\\\"num cap\\\">250–350 ms<\\/span><\\/div>\\n        <div style=\\\"display: grid; grid-template-columns: 180px 1fr 90px; align-items: center; gap: 12px\\\"><span style=\\\"font-size: 14px\\\">Bottom sheet<\\/span><span style=\\\"height: 8px; border-radius: 4px; background: #141518; width: 17%\\\"><\\/span><span class=\\\"num cap\\\">300–450 ms<\\/span><\\/div>\\n        <div style=\\\"display: grid; grid-template-columns: 180px 1fr 90px; align-items: center; gap: 12px\\\"><span style=\\\"font-size: 14px\\\">Estado financiero<\\/span><span style=\\\"height: 8px; border-radius: 4px; background: #141518; width: 34%\\\"><\\/span><span class=\\\"num cap\\\">500–900 ms<\\/span><\\/div>\\n        <div style=\\\"display: grid; grid-template-columns: 180px 1fr 90px; align-items: center; gap: 12px\\\"><span style=\\\"font-size: 14px\\\">Loader (loop)<\\/span><span style=\\\"height: 8px; border-radius: 4px; background: #FF9000; width: 64%\\\"><\\/span><span class=\\\"num cap\\\">1.6 / 2.4 s<\\/span><\\/div>\\n        <div style=\\\"display: grid; grid-template-columns: 180px 1fr 90px; align-items: center; gap: 12px\\\"><span style=\\\"font-size: 14px\\\">Splash<\\/span><span style=\\\"height: 8px; border-radius: 4px; background: #141518; width: 100%\\\"><\\/span><span class=\\\"num cap\\\">≤ 2.5 s<\\/span><\\/div>\\n      <\\/div>\\n    <\\/div>\\n    <div class=\\\"card\\\" style=\\\"padding: 24px\\\">\\n      <h2 class=\\\"h3\\\">Curvas<\\/h2>\\n      <div style=\\\"margin-top: 18px; display: flex; flex-direction: column; gap: 22px\\\">\\n        <div><div style=\\\"display: flex; justify-content: space-between; margin-bottom: 10px\\\"><span style=\\\"font-size: 14px; font-weight: 500\\\">Entrada · ease-out<\\/span><span class=\\\"num cap\\\">cubic-bezier(.2,.8,.2,1)<\\/span><\\/div><d    <span class=\\\"shadow\\\"><\\/span>\\n              <div class=\\\"tile\\\">\\n                <svg class=\\\"trace\\\" viewBox=\\\"0 0 100 100\\\" preserveAspectRatio=\\\"none\\\"><rect x=\\\"1\\\" y=\\\"1\\\" width=\\\"98\\\" height=\\\"98\\\" rx=\\\"30\\\" pathLength=\\\"100\\\"><\\/rect><\\/svg>\\n                <span class=\\\"bi\\\">BI<span style=\\\"display: block; width: 16px; height: 3px; border-radius: 2px; background: #FF9000\\\"><\\/span><\\/span>\\n                <span class=\\\"g g-ok\\\"><svg width=\\\"44\\\" height=\\\"44\\\" viewBox=\\\"0 0 24 24\\\" fill=\\\"none\\\" stroke=\\\"#FFFFFF\\\" stroke-width=\\\"2.4\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"><path d=\\\"M5.5 12.5l4.2 4.2L18.5 8\\\" pathLength=\\\"1\\\"><\\/path><\\/svg><\\/span>\\n                <span class=\\\"g g-warn\\\"><svg width=\\\"40\\\" height=\\\"40\\\" viewBox=\\\"0 0 24 24\\\" fill=\\\"none\\\" stroke=\\\"#141518\\\" stroke-width=\\\"1.9\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"><circle cx=\\\"12\\\" cy=\\\"12\\\" r=\\\"8.5\\\"><\\/circle><path d=\\\"M12 7.5V12l3 2\\\"><\\/path><\\/svg><\\/span>\\n                <span class=\\\"g g-err\\\"><svg width=\\\"36\\\" height=\\\"36\\\" viewBox=\\\"0 0 24 24\\\" fill=\\\"none\\\" stroke=\\\"#B3261E\\\" stroke-width=\\\"2.4\\\" stroke-linecap=\\\"round\\\"><path d=\\\"M12 6v8M12 18h.01\\\"><\\/path><\\/svg><\\/span>\\n              <\\/div>\\n              <svg class=\\\"ring\\\" width=\\\"120\\\" height=\\\"120\\\" viewBox=\\\"0 0 120 120\\\" fill=\\\"none\\\"><circle cx=\\\"60\\\" cy=\\\"60\\\" r=\\\"57\\\" stroke=\\\"#A8A59E\\\" stroke-width=\\\"1.5\\\" stroke-dasharray=\\\"3 7\\\" stroke-linecap=\\\"round\\\"><\\/circle><\\/svg>\\n            <\\/div>\\n            <div style=\\\"text-align: center\\\"><div style=\\\"font-size: 13px; font-weight: 700; letter-spacing: .06em\\\">{{m.name}}<\\/div><div class=\\\"cap\\\">{{m.rule}}<\\/div><\\/div>\\n          <\\/div>\\n        <\\/sc-f
